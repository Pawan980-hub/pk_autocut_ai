name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate Android Skeleton & Fix Kotlin/SDK
        run: |
          flutter create --platforms=android .
          # Force Kotlin 1.9.24 directly inside build.gradle and settings.gradle
          find android/ -name "*.gradle*" -exec sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.24'/g" {} +
          find android/ -name "*.gradle*" -exec sed -i "s/org.jetbrains.kotlin.android:1.[0-9].[0-9]*/org.jetbrains.kotlin.android:1.9.24/g" {} +
          find android/ -name "*.gradle*" -exec sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' {} +
          # Force minSdkVersion 24
          find android/ -name "*.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' {} +
          find android/ -name "*.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' {} +

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pk-AutoCut-ai-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          
