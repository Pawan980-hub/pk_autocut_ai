name: pk_autocut_ai
description: "pk AutoCut ai - Universal Auto AI Video Editor"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Media & File Handling
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  video_player: ^2.8.2
  chewie: ^1.7.4
  
  # Local Rendering Engine (Zero-Cost On-Device)
  ffmpeg_kit_flutter_full_gpl: ^6.0.3
  
  # Networking & APIs (BYOK Hub)
  http: ^1.2.0
  dio: ^5.4.0
  
  # Payments
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sfx/
    
